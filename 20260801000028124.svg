<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 850" width="100%" height="100%" style="background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  
  <defs>
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- 渐变色定义 -->
    <linearGradient id="jtbd-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    
    <linearGradient id="action-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- 箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ef4444"/>
    </marker>
  </defs>

  <!-- 背景网格（点状装饰） -->
  <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#cbd5e1" />
  </pattern>
  <rect width="1000" height="850" fill="url(#dots)" opacity="0.5"/>

  <!-- ==================== 1. 顶层能量源：JTBD ==================== -->
  <g transform="translate(150, 30)" filter="url(#shadow)">
    <rect width="700" height="65" rx="32.5" fill="url(#jtbd-grad)" />
    <text x="350" y="30" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">【顶层引擎】JTBD 待办任务理论 (Jobs-to-be-Done)</text>
    <text x="350" y="48" fill="#ddd6fe" font-size="13" text-anchor="middle">驱动力：发生困难 (Situation) → 产生动机 (Motivation) → 追求理想进阶状态 (Progress)</text>
  </g>

  <!-- ==================== 区域外框：决策迷宫主线 ==================== -->
  <rect x="50" y="130" width="900" height="520" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  <text x="80" y="165" fill="#1e293b" font-size="18" font-weight="bold">【决策迷宫主线】买家心智非线性递进</text>

  <!-- 主线节点 1: 需要 -->
  <g transform="translate(90, 200)">
    <rect width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="28" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">1. 需要</text>
    <text x="60" y="46" fill="#64748b" font-size="11" text-anchor="middle">感知现实落差</text>
  </g>

  <!-- 主线节点 2: 问题 -->
  <g transform="translate(250, 200)">
    <rect width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="28" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">2. 问题</text>
    <text x="60" y="46" fill="#64748b" font-size="11" text-anchor="middle">痛点具体化</text>
  </g>

  <!-- 主线节点 3: 需求 -->
  <g transform="translate(410, 200)">
    <rect width="120" height="60" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="28" fill="#334155" font-size="14" font-weight="bold" text-anchor="middle">3. 需求</text>
    <text x="60" y="46" fill="#64748b" font-size="11" text-anchor="middle">寻求解法形态</text>
  </g>

  <!-- 节点 3 附近的插件: CDJ 初始心智 -->
  <g transform="translate(400, 140)">
    <rect width="140" height="35" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="70" y="22" fill="#92400e" font-size="11" font-weight="bold" text-anchor="middle">McKinsey CDJ 初始心智</text>
  </g>

  <!-- Messy Middle 混乱漩涡区域 -->
  <rect x="80" y="300" width="460" height="180" rx="15" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="100" y="325" fill="#1d4ed8" font-size="13" font-weight="bold">Messy Middle 混乱漩涡 (Google)</text>

  <!-- Messy Middle 内部 2 节点 -->
  <g transform="translate(110, 360)">
    <rect width="160" height="60" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="28" fill="#1e3a8a" font-size="13" font-weight="bold" text-anchor="middle">4. 产品集合 (Set)</text>
    <text x="80" y="46" fill="#2563eb" font-size="11" text-anchor="middle">探索 (Explore: 做加法)</text>
  </g>
  <g transform="translate(350, 360)">
    <rect width="160" height="60" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="28" fill="#1e3a8a" font-size="13" font-weight="bold" text-anchor="middle">评估与筛选</text>
    <text x="80" y="46" fill="#2563eb" font-size="11" text-anchor="middle">评估 (Evaluate: 做减法)</text>
  </g>

  <!-- 插件: Gartner B2B 任务 -->
  <g transform="translate(230, 440)">
    <rect width="160" height="30" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="80" y="19" fill="#1e40af" font-size="10" font-weight="bold" text-anchor="middle">Gartner 6大B2B买家任务</text>
  </g>

  <!-- 主线节点 4.5: 理性最优解 -->
  <g transform="translate(600, 360)">
    <rect width="130" height="60" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="65" y="28" fill="#334155" font-size="13" font-weight="bold" text-anchor="middle">4.5 理性最优解</text>
    <text x="65" y="46" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">⚠️ 购物车瘫痪/改变焦虑</text>
  </g>

  <!-- 节点 4.5 破局插件: 行为心理杠杆 -->
  <g transform="translate(585, 450)">
    <rect width="160" height="40" rx="8" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/>
    <text x="80" y="18" fill="#9a3412" font-size="11" font-weight="bold" text-anchor="middle">Behavioral Nudges</text>
    <text x="80" y="32" fill="#c2410c" font-size="10" text-anchor="middle">稀缺/社会认同/零风险承诺</text>
  </g>

  <!-- 主线节点 5: 决策成交 (关键一跃) -->
  <g transform="translate(780, 340)" filter="url(#shadow)">
    <rect width="140" height="100" rx="15" fill="url(#action-grad)"/>
    <text x="70" y="38" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">5. 决策成交</text>
    <text x="70" y="58" fill="#ffedd5" font-size="12" font-weight="bold" text-anchor="middle">【关键一跃】</text>
    <text x="70" y="78" fill="#ffffff" font-size="11" text-anchor="middle">拿出钱包 / 支付</text>
  </g>

  <!-- 主线节点 6: 售后与生态 -->
  <g transform="translate(410, 550)">
    <rect width="200" height="70" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="100" y="30" fill="#065f46" font-size="14" font-weight="bold" text-anchor="middle">6. 售后体验与生态</text>
    <text x="100" y="50" fill="#047857" font-size="11" text-anchor="middle">Forrester 体验 &amp; HubSpot 飞轮</text>
  </g>


  <!-- ==================== 动态连接线与能量流向 ==================== -->

  <!-- 1. JTBD 对主线的贯穿 (紫色虚线) -->
  <path d="M 500 95 L 500 130" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <path d="M 200 95 C 100 95, 150 300, 150 360" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-purple)"/>

  <!-- 2. 正向主线箭头 (灰色) -->
  <path d="M 210 230 L 250 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 370 230 L 410 230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 470 260 L 340 300" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Messy Middle 内部双向循环箭头 -->
  <path d="M 270 380 Q 310 360 350 380" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 350 400 Q 310 420 270 400" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Messy Middle -> 4.5 -->
  <path d="M 510 390 L 600 390" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4.5 -> 关键一跃 (橙色粗线) -->
  <path d="M 730 390 L 780 390" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow-orange)"/>
  <!-- 杠杆助推力 -->
  <path d="M 665 450 L 665 420" stroke="#f97316" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-orange)"/>

  <!-- 5 -> 6 (售后) -->
  <path d="M 850 440 C 850 585, 700 585, 610 585" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>


  <!-- ==================== 特殊非线性路径 (关键亮点) ==================== -->

  <!-- 逆向回溯: 购物车瘫痪吓退回 2 问题 (红色虚线) -->
  <path d="M 665 360 C 665 260, 400 260, 370 240" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="490" y="270" width="130" height="20" rx="4" fill="#fee2e2"/>
  <text x="555" y="284" fill="#991b1b" font-size="10" text-anchor="middle">卡扣退缩: 重新审视痛点</text>

  <!-- 极速跳跃: 权威背书直达成交 (橙色虚线) -->
  <path d="M 310 200 C 310 160, 750 160, 800 340" fill="none" stroke="#f97316" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-orange)"/>
  <rect x="520" y="145" width="130" height="20" rx="4" fill="#ffedd5"/>
  <text x="585" y="159" fill="#9a3412" font-size="10" font-weight="bold" text-anchor="middle">权威背书: 跨节点极速直达</text>

  <!-- 反哺路径 1: 极速忠忠环 Loyalty Loop (绿色实线) -->
  <path d="M 410 585 C 200 585, 470 300, 470 260" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <rect x="250" y="520" width="160" height="22" rx="4" fill="#d1fae5"/>
  <text x="330" y="535" fill="#065f46" font-size="10" font-weight="bold" text-anchor="middle">【极速忠诚环】跳过海选与评估</text>

  <!-- 反哺路径 2: 口碑注入初始心智 CDJ (绿色细线) -->
  <path d="M 510 550 C 510 500, 560 180, 540 160" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>

  <!-- 图例说明 (Footer) -->
  <g transform="translate(50, 680)">
    <rect width="900" height="130" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="20" y="25" fill="#334155" font-size="12" font-weight="bold">图例与动态联动说明：</text>

    <circle cx="30" cy="50" r="6" fill="#64748b"/>
    <text x="45" y="54" fill="#475569" font-size="11">主线认知递进（常规路径）</text>

    <circle cx="230" cy="50" r="6" fill="#8b5cf6"/>
    <text x="245" y="54" fill="#475569" font-size="11">JTBD 动机能量注入</text>

    <circle cx="430" cy="50" r="6" fill="#2563eb"/>
    <text x="445" y="54" fill="#475569" font-size="11">Messy Middle 信息拉锯漩涡</text>

    <circle cx="630" cy="50" r="6" fill="#ea580c"/>
    <text x="645" y="54" fill="#475569" font-size="11">行为心理杠杆 (触发临门一脚)</text>

    <circle cx="30" cy="85" r="6" fill="#f97316"/>
    <text x="45" y="89" fill="#475569" font-size="11">跨节点极速跃迁（捷径）</text>

    <circle cx="230" cy="85" r="6" fill="#ef4444"/>
    <text x="245" y="89" fill="#475569" font-size="11">防御性撤退/回溯（卡扣点）</text>

    <circle cx="430" cy="85" r="6" fill="#10b981"/>
    <text x="445" y="89" fill="#475569" font-size="11">生态飞轮反哺 &amp; 极速忠诚环 (Loyalty Loop)</text>
  </g>

</svg>
